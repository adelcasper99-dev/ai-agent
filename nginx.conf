limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=token_zone:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=3r/m;

server {
    listen 80;
    server_name voice.casper-pos.com;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voice.casper-pos.com;

    ssl_certificate     /etc/letsencrypt/live/voice.casper-pos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.casper-pos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Body size & timeout for voice processing
    client_max_body_size 20m;
    proxy_read_timeout 60s;

    # Telegram Webhook - Rate Limited
    location /api/telegram/webhook {
        limit_req zone=webhook_zone burst=10 nodelay;
        proxy_pass         http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # LiveKit Token - Rate Limited
    location /api/livekit/token {
        limit_req zone=token_zone burst=5 nodelay;
        proxy_pass         http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Admin Login - Rate Limited
    location /api/auth/login {
        limit_req zone=login_zone burst=2 nodelay;
        proxy_pass         http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Casper Voice Web App & General Proxy (Port 3006)
    location / {
        proxy_pass         http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
