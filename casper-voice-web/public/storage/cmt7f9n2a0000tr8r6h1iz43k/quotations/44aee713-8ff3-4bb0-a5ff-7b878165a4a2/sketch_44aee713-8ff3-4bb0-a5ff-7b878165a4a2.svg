<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" style="background:#0f172a; font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.30" />
    </linearGradient>
    <!-- Aluminum frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- Dimension arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Aluminum Frame -->
  <rect x="156" y="70" width="288" height="340" rx="4" fill="url(#frameGrad)" stroke="#94a3b8" stroke-width="2" />

  <!-- Inner Left Glass Panel -->
  <rect x="170" y="84" 
        width="123" 
        height="312" 
        fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Inner Right Glass Panel (Sliding / Fixed) -->
  <rect x="307" y="84" 
        width="123" 
        height="312" 
        fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Middle Mullion / Interlock Profile -->
  <rect x="293" y="70" 
        width="14" height="340" 
        fill="url(#frameGrad)" stroke="#64748b" stroke-width="1" />

  <!-- Glass reflection light glare lines -->
  <line x1="185" y1="99" 
        x2="257" y2="376" 
        stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 15" />
  <line x1="329" y1="99" 
        x2="401" y2="376" 
        stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 15" />

  <!-- Top Width Dimension Line -->
  <line x1="156" y1="45" x2="444" y2="45" 
        stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="156" y1="35" x2="156" y2="65" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="444" y1="35" x2="444" y2="65" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Width Label Badge -->
  <rect x="245" y="26" width="110" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="300" y="44" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">العرض: 110 سم</text>

  <!-- Right Height Dimension Line -->
  <line x1="469" y1="70" x2="469" y2="410" 
        stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="449" y1="70" x2="479" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="449" y1="410" x2="479" y2="410" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Height Label Badge -->
  <rect x="479" y="226" width="115" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="536" y="245" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">الارتفاع: 130 سم</text>

  <!-- Footer Info Specs -->
  <rect x="30" y="445" width="540" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="550" y="470" fill="#94a3b8" font-size="13" text-anchor="end">قطاع ألوميتال هندسي معتمد</text>
  <text x="50" y="470" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="start">المساحة: 1.43 م²</text>
</svg>