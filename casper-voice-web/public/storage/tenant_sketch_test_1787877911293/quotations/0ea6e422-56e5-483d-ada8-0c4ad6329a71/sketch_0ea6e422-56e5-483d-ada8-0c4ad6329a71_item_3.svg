<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" style="background:#0f172a; font-family:'Cairo', 'Noto Sans Arabic', 'DejaVu Sans', Tahoma, sans-serif;">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.30" />
    </linearGradient>
    <!-- Aluminum frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- Dimension arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0f172a" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Top Title Bar -->
  <rect x="25" y="16" width="550" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="555" y="43" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="end">بند 3: باب (4 قطع)</text>
  <text x="45" y="43" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">المقاس: 90 × 210 سم</text>

  <!-- Outer Aluminum Profile Frame -->
  <rect x="230" y="85" width="141" height="330" rx="4" fill="url(#frameGrad)" stroke="#94a3b8" stroke-width="2" />

  <!-- Dynamic Interior Architecture -->
  
      <!-- Door Main Leaf -->
      <rect x="240" y="95" 
            width="121" height="310" 
            fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" rx="2" />
      
      <!-- Door Top Glass Panel & Lower Kickplate -->
      <rect x="250" y="105" 
            width="101" height="171" 
            fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
      <rect x="250" y="297" 
            width="101" height="93" 
            fill="#1e293b" stroke="#64748b" stroke-width="1" />

      <!-- Door Handle & Keyhole Knob -->
      <circle cx="343" cy="267" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
      <rect x="340" cy="253" width="6" height="28" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      
      <!-- Door Swing Arc Indicator -->
      <path d="M 240 405 A 121 121 0 0 0 361 405" 
            fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />
    

  <!-- Top Width Dimension Line -->
  <line x1="230" y1="63" x2="371" y2="63" 
        stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="230" y1="55" x2="230" y2="81" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="371" y1="55" x2="371" y2="81" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Width Label Badge -->
  <rect x="236" y="43" width="130" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="301" y="60" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">العرض: 90 سم</text>

  <!-- Right Height Dimension Line -->
  <line x1="395" y1="85" x2="395" y2="415" 
        stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="375" y1="85" x2="403" y2="85" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="375" y1="415" x2="403" y2="415" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Height Label Badge -->
  <rect x="403" y="236" width="130" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="468" y="255" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">الارتفاع: 210 سم</text>

  <!-- Footer Info Specs -->
  <rect x="25" y="445" width="550" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="555" y="469" fill="#94a3b8" font-size="13" text-anchor="end">قطاع ألوميتال هندسي معتمد — باب ألوميتال</text>
  <text x="45" y="469" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="start">مساحة الوحدة: 1.89 م² | الإجمالي: 7.56 م²</text>
</svg>